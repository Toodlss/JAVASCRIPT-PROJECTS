<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Project 2 - Functions</title>
</head>

<body>

    <h1>JavaScript Function Project</h1>

    <!-- Button that triggers the function -->
    <button onclick="displayMessage()">Click Me!</button>

    <!-- Paragraph with the same ID used in getElementById -->
    <p id="output"></p>

    <!-- Linking the external JavaScript file -->
    <script src="JS/main.js"></script>

    <h1>Concatenation Project</h1>

    <!-- Paragraph with an id attribute -->
    <p id="message"></p>

    <!-- Button that calls the JavaScript function -->
    <button onclick="addText()">Click Here</button>

    <!-- Linking external JavaScript file -->
    <script src="JS/main.js"></script>

</body>

</html>
